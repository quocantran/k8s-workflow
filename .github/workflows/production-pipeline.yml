name: Production GitOps CI Pipeline (Docker Hub & GitOps)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# GitOps Principle: CI strictly builds, tests, pushes images, and updates Git manifests.
# CI NEVER directly connects to or modifies the Kubernetes cluster.

env:
  PATH: /usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
  REGISTRY_AUTH_FILE: /etc/containers/auth.json

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # STAGE 1: Code Quality & Unit Tests
  # ─────────────────────────────────────────────────────────────
  test-and-lint:
    name: 🧪 Quality Check & Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test & Lint Backend
        run: |
          cd backend
          npm install --quiet
          npm run lint
          npm run test

      - name: Test & Lint Gateway
        run: |
          cd gateway
          npm install --quiet
          npm run lint
          npm run test

  # ─────────────────────────────────────────────────────────────
  # STAGE 2: Build & Push Images to Docker Hub
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Images to Docker Hub
    needs: test-and-lint
    runs-on: self-hosted
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Immutable Version Tag (SemVer + Git SHA)
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v1.0.0-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Target Version: ${TAG}"

      - name: Build Images via Podman
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REGISTRY="docker.io/quocantran"

          echo "==> Building Backend image: ${REGISTRY}/movie-backend:${TAG}..."
          podman build -t "${REGISTRY}/movie-backend:${TAG}" -f backend/Dockerfile backend/

          echo "==> Building Gateway image: ${REGISTRY}/movie-gateway:${TAG}..."
          podman build -t "${REGISTRY}/movie-gateway:${TAG}" -f gateway/Dockerfile gateway/

          echo "==> Building Frontend image: ${REGISTRY}/movie-frontend:${TAG}..."
          podman build -t "${REGISTRY}/movie-frontend:${TAG}" -f frontend/Dockerfile frontend/

      - name: Push Images to Docker Hub
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REGISTRY="docker.io/quocantran"

          echo "==> Pushing Backend to Docker Hub..."
          podman push "${REGISTRY}/movie-backend:${TAG}"

          echo "==> Pushing Gateway to Docker Hub..."
          podman push "${REGISTRY}/movie-gateway:${TAG}"

          echo "==> Pushing Frontend to Docker Hub..."
          podman push "${REGISTRY}/movie-frontend:${TAG}"

          echo "✅ Đã đẩy thành công tất cả Docker images lên Docker Hub!"

      - name: Prune Dangling Build Images
        if: always()
        run: |
          echo "==> Cleaning up dangling build layers..."
          podman image prune -f || true

  # ─────────────────────────────────────────────────────────────
  # STAGE 3: GitOps Manifest Promotion (Target: k8s-gitops Repo)
  # ─────────────────────────────────────────────────────────────
  promote-gitops:
    name: 🚀 GitOps Promotion to k8s-gitops Repo
    needs: build-and-push
    runs-on: self-hosted
    permissions:
      contents: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout k8s-gitops Manifests Repository
        uses: actions/checkout@v4
        with:
          repository: quocantran/k8s-gitops
          token: ${{ secrets.GITOPS_TOKEN || github.token }}
          path: gitops-repo

      - name: Update Kubernetes Manifests Image Tags
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          echo "==> Bumping GitOps image tag to ${TAG} in k8s-gitops..."
          
          cd gitops-repo/apps/movie-booking/overlays/production
          kustomize edit set image docker.io/quocantran/movie-backend="docker.io/quocantran/movie-backend:${TAG}"
          kustomize edit set image docker.io/quocantran/movie-gateway="docker.io/quocantran/movie-gateway:${TAG}"
          kustomize edit set image docker.io/quocantran/movie-frontend="docker.io/quocantran/movie-frontend:${TAG}"

      - name: Commit & Push to k8s-gitops (Triggering ArgoCD)
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apps/movie-booking/overlays/
          if git diff --staged --quiet; then
            echo "No manifest changes detected in k8s-gitops."
          else
            git commit -m "chore(gitops): promote image tags to ${TAG} [skip ci]"
            git push origin HEAD:main
            echo "✅ Đã commit & push GitOps manifest lên quocantran/k8s-gitops. ArgoCD sẽ tự động hòa giải (reconcile)!"
          fi
