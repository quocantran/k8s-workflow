apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: movie-booking-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: movie-booking
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/quocantran/k8s-workflow.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: movie-booking
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfOrder=true
