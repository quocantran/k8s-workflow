# Pattern Kubernetes chuẩn: Kết nối Database ngoài (Host Percona MySQL)
# Không khai báo selector trong Service -> Tạo Endpoints thủ công trỏ tới IP của Host.
apiVersion: v1
kind: Service
metadata:
  name: mysql-external
  namespace: movie-booking
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mysql-external
  namespace: movie-booking
subsets:
  - addresses:
      - ip: 192.168.48.100 # IP Host cài Percona Server của bạn
    ports:
      - name: mysql
        port: 3306
