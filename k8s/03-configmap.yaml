apiVersion: v1
kind: ConfigMap
metadata:
  name: movie-app-config
  namespace: movie-booking
data:
  # Kết nối tới Database Percona ngoài Host thông qua K8s Service
  DB_HOST: "mysql-external"
  DB_PORT: "3306"
  DB_NAME: "movie_db"
  # Kết nối tới Redis Service chạy bên trong K8s
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  # Gateway gọi Backend Service qua CoreDNS K8s
  BACKEND_SERVICE_URL: "http://backend-service:5000"
