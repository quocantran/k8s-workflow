apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-service
  namespace: movie-booking
  labels:
    app: backend-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend-service
  template:
    metadata:
      labels:
        app: backend-service
    spec:
      containers:
      - name: backend
        image: movie-backend:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 5000
        env:
          - name: PORT
            value: "5000"
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: movie-app-config
                key: DB_HOST
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: movie-app-config
                key: DB_PORT
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: movie-app-config
                key: DB_NAME
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: movie-db-secret
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: movie-db-secret
                key: DB_PASSWORD
          - name: REDIS_HOST
            valueFrom:
              configMapKeyRef:
                name: movie-app-config
                key: REDIS_HOST
          - name: REDIS_PORT
            valueFrom:
              configMapKeyRef:
                name: movie-app-config
                key: REDIS_PORT
        resources:
          requests:
            cpu: "80m"
            memory: "120Mi"
          limits:
            cpu: "500m"
            memory: "350Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: movie-booking
spec:
  type: ClusterIP
  selector:
    app: backend-service
  ports:
    - port: 5000
      targetPort: 5000
