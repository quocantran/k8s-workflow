apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: movie-booking
  labels:
    app: gateway-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: gateway
        image: docker.io/quocantran/movie-gateway:v1.0.1
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8080
        env:
          - name: PORT
            value: "8080"
          - name: BACKEND_SERVICE_URL
            valueFrom:
              configMapKeyRef:
                name: movie-app-config
                key: BACKEND_SERVICE_URL
        resources:
          requests:
            cpu: "50m"
            memory: "100Mi"
          limits:
            cpu: "400m"
            memory: "250Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: movie-booking
spec:
  type: ClusterIP
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
