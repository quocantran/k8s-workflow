apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: movie-booking
  labels:
    app: frontend-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: frontend
        image: docker.io/quocantran/movie-frontend:v1.0.0-51eedc0
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 3000
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "150m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: movie-booking
spec:
  type: ClusterIP
  selector:
    app: frontend-service
  ports:
    - port: 3000
      targetPort: 3000
