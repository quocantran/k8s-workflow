apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: movie-booking

resources:
- 01-namespace.yaml
- 02-external-mysql.yaml
- 03-configmap.yaml
- 04-redis.yaml
- 05-backend.yaml
- 06-gateway.yaml
- 07-frontend.yaml
- 08-ingress.yaml
- 09-hpa.yaml

images:
- name: docker.io/quocantran/movie-backend
  newName: docker.io/quocantran/movie-backend
  newTag: v1.0.1
- name: docker.io/quocantran/movie-frontend
  newName: docker.io/quocantran/movie-frontend
  newTag: v1.0.1
- name: docker.io/quocantran/movie-gateway
  newName: docker.io/quocantran/movie-gateway
  newTag: v1.0.1
